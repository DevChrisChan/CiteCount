<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>IB Exam Countdowns - CiteCount</title>

	<meta property="og:title" content="IB Exam Countdowns - CiteCount" />
	<meta property="og:description" content="Choose the IB exam year countdown you want to follow. Live first-exam countdowns for May 2025, May 2026, November 2026, and May 2027." />
	<meta property="og:url" content="https://citecount.com/countdown/" />
	<meta property="og:type" content="website" />
	<meta name="description" content="Choose the IB exam year countdown you want to follow. Live first-exam countdowns for May 2025, May 2026, November 2026, and May 2027.">
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f4" />
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />

	<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
	<link rel="shortcut icon" href="/favicon/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
	<meta name="apple-mobile-web-app-title" content="CiteCount" />
	<link rel="manifest" href="/favicon/site.webmanifest" />

	<link href="/v2/style.css" rel="stylesheet">
	<link href="/v2/flowbite.css" rel="stylesheet">

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background: var(--background-primary);
			color: var(--text-primary);
			display: flex;
			flex-direction: column;
		}

		.landing-main {
			padding: 2rem 1rem 4rem;
		}

		.landing-container {
			max-width: 1180px;
			margin: 0 auto;
			width: 100%;
		}

		.landing-hero {
			padding: 0.5rem 0 1.25rem;
		}

		.landing-hero h1 {
			margin: 0 0 0.75rem;
			font-size: clamp(2rem, 4vw, 3.25rem);
			line-height: 1.05;
			font-weight: 900;
		}

		.landing-hero p {
			max-width: 68ch;
			margin: 0;
			color: var(--text-secondary);
			font-size: 1rem;
			line-height: 1.7;
		}

		.year-section {
			margin-top: 1.5rem;
		}

		.section-title {
			margin: 0 0 0.85rem;
			font-size: 1rem;
			font-weight: 800;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			color: var(--text-secondary);
		}

		.section-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 1rem;
		}

		.section-empty {
			padding: 1rem 0;
			color: var(--text-secondary);
			font-size: 0.95rem;
		}

		.year-card {
			background: var(--surface-color);
			border: 1px solid var(--border-primary);
			border-radius: 20px;
			padding: 1.25rem;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
			display: flex;
			flex-direction: column;
			gap: 1rem;
			transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
		}

		.year-card:hover {
			transform: translateY(-2px);
			box-shadow: 0 14px 28px rgba(0, 0, 0, 0.08);
			border-color: rgba(30, 64, 175, 0.35);
		}

		.year-card-top {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 1rem;
		}

		.year-name {
			margin: 0;
			font-size: 1.35rem;
			font-weight: 900;
			line-height: 1.15;
		}

		.year-subtitle {
			margin: 0.4rem 0 0;
			color: var(--text-secondary);
			font-size: 0.95rem;
			line-height: 1.45;
		}

		.year-badge {
			flex: none;
			padding: 0.45rem 0.75rem;
			border-radius: 999px;
			font-size: 0.78rem;
			font-weight: 800;
			letter-spacing: 0.04em;
			text-transform: uppercase;
			border: 1px solid var(--border-primary);
			background: var(--background-secondary);
			color: var(--text-secondary);
		}

		.year-badge.live {
			color: var(--accent-color);
			background: rgba(30, 64, 175, 0.08);
			border-color: rgba(30, 64, 175, 0.12);
		}

		.year-badge.past {
			color: var(--text-secondary);
			background: var(--background-secondary);
			border-color: var(--border-primary);
		}

		.countdown-grid {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 0.75rem;
		}

		.countdown-tile {
			padding: 0.9rem 0.6rem;
			border-radius: 16px;
			text-align: center;
			border: 1px solid var(--border-primary);
			background: rgba(0, 0, 0, 0.015);
		}

		@media (prefers-color-scheme: dark) {
			.countdown-tile {
				background: rgba(255, 255, 255, 0.03);
			}
		}

		.countdown-number {
			display: block;
			font-size: clamp(1.1rem, 2vw, 1.5rem);
			font-weight: 900;
			line-height: 1;
		}

		.countdown-label {
			display: block;
			margin-top: 0.35rem;
			color: var(--text-secondary);
			font-size: 0.76rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.06em;
		}

		.card-actions {
			display: flex;
			gap: 0.75rem;
			flex-wrap: wrap;
		}

		.year-link {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-width: 9rem;
			padding: 0.75rem 1rem;
			border-radius: 999px;
			text-decoration: none;
			font-weight: 800;
			border: 1px solid var(--border-primary);
			background: var(--surface-color);
			color: var(--text-primary);
			transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
		}

		.year-link.primary {
			border-color: var(--accent-color);
			background: var(--accent-color);
			color: white;
		}

		.year-link:hover {
			transform: translateY(-1px);
		}

		.landing-footer-note {
			margin-top: 1rem;
			color: var(--text-secondary);
			font-size: 0.95rem;
			line-height: 1.6;
		}

		.loading-note {
			padding: 1rem 0;
			color: var(--text-secondary);
			font-size: 0.95rem;
		}

		@media (max-width: 900px) {
			.section-grid {
				grid-template-columns: 1fr;
			}
		}

		@media (max-width: 640px) {
			.landing-main {
				padding-inline: 0.85rem;
			}

			.year-card {
				padding: 1.1rem;
			}

			.countdown-grid {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}

			.year-link {
				width: 100%;
			}
		}
	</style>
</head>

<body>
	<div>
		<header class="flex justify-between items-center">
			<div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='/';" style="user-select: none;">
				<img src="/assets/logo.svg" alt="CiteCount Logo" class="h-6 w-6 logo">
				<h1 class="text-xl font-bold text-black dark:text-white" style="font-weight: 900; font-size: 1.25rem!important;">CiteCount</h1>
			</div>
			<div class="flex items-center gap-2">
				<button id="other-apps-btn" class="p-2 rounded-md flex items-center gap-2" data-tooltip="More Apps" onclick="toggleAppsModal()"
					data-lta-event="v2-more-apps-click">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
						<path d="M3 5a2 2 0 012-2h4a2 2 0 012 2v4a2 2 0 01-2 2H5a2 2 0 01-2-2V5zM13 5a2 2 0 012-2h4a2 2 0 012 2v4a2 2 0 01-2 2h-4a2 2 0 01-2-2V5zM3 15a2 2 0 012-2h4a2 2 0 012 2v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4zM13 15a2 2 0 012-2h4a2 2 0 012 2v4a2 2 0 01-2 2h-4a2 2 0 01-2-2v-4z" />
					</svg>
					<span class="hidden md:inline text-sm font-medium">More Apps</span>
				</button>
			</div>
		</header>

		<main class="content-area landing-main" style="padding-top: 5rem; min-height: 60vh;">
			<div class="landing-container">
				<section class="landing-hero">
					<h1>IB exam countdowns</h1>
					<p>
						Pick the exam cycle you want to track. The live years below count down to the next upcoming exam.
					</p>
				</section>

					<section class="year-section" aria-labelledby="upcoming-exams-title">
						<h2 class="section-title" id="upcoming-exams-title">Upcoming exams</h2>
						<div class="section-grid" id="upcomingYearPicker" aria-label="Upcoming IB exam countdowns">
							<div class="section-empty">Loading exam dates...</div>
						</div>
					</section>

					<section class="year-section" aria-labelledby="archived-exams-title">
						<h2 class="section-title" id="archived-exams-title">Archived exams</h2>
						<div class="section-grid" id="archivedYearPicker" aria-label="Archived IB exam countdowns">
							<div class="section-empty">Loading exam dates...</div>
						</div>
				</section>
			</div>
		</main>

		<div id="footer-placeholder"></div>
	</div>

	<script src="/v2/apps-modal.js"></script>
	<script src="/components/footer-loader.js"></script>
	<script>
		const yearConfigs = [
			{
				code: 'n26',
				label: 'November 2026',
				path: '/countdown/n26/',
				availability: 'live',
				statusLabel: 'Available'
			},
			{
				code: 'm27',
				label: 'May 2027',
				path: '/countdown/m27/',
				availability: 'live',
				statusLabel: 'Available'
			},
			{
				code: 'm25',
				label: 'May 2025',
				path: '/countdown/m25/',
				availability: 'past',
				statusLabel: 'Archived'
			},
			{
				code: 'm26',
				label: 'May 2026',
				path: '/countdown/m26/',
				availability: 'past',
				statusLabel: 'Archived'
			}
		];

		const upcomingYearPicker = document.getElementById('upcomingYearPicker');
		const archivedYearPicker = document.getElementById('archivedYearPicker');
		const dateFormatter = new Intl.DateTimeFormat(undefined, {
			month: 'short',
			day: 'numeric',
			year: 'numeric'
		});

		const cardState = new Map();

		function clearContainer(container) {
			if (container.dataset.ready === 'true') {
				return;
			}

			container.innerHTML = '';
			container.dataset.ready = 'true';
		}

		function buildCard(config) {
			const card = document.createElement('article');
			card.className = 'year-card';
			card.dataset.code = config.code;
			card.dataset.state = config.availability;

			card.innerHTML = config.availability === 'live' ? `
				<div class="year-card-top">
					<div>
						<h2 class="year-name">${config.label}</h2>
						<p class="year-subtitle">Open the active countdown for this year.</p>
					</div>
					<span class="year-badge ${config.availability}">${config.statusLabel}</span>
				</div>

				<div class="countdown-grid" aria-live="polite">
					<div class="countdown-tile">
						<span class="countdown-number" data-unit="days">--</span>
						<span class="countdown-label">Days</span>
					</div>
					<div class="countdown-tile">
						<span class="countdown-number" data-unit="hours">--</span>
						<span class="countdown-label">Hours</span>
					</div>
					<div class="countdown-tile">
						<span class="countdown-number" data-unit="minutes">--</span>
						<span class="countdown-label">Mins</span>
					</div>
					<div class="countdown-tile">
						<span class="countdown-number" data-unit="seconds">--</span>
						<span class="countdown-label">Secs</span>
					</div>
				</div>

				<div class="card-actions">
					<a class="year-link primary" href="${config.path}">Open countdown</a>
				</div>
			` : `
				<div class="year-card-top">
					<div>
						<h2 class="year-name">${config.label}</h2>
						<p class="year-subtitle">Archived for quick access.</p>
					</div>
					<span class="year-badge ${config.availability}">${config.statusLabel}</span>
				</div>

				<div class="card-actions">
					<a class="year-link primary" href="${config.path}">Open countdown</a>
				</div>
			`;

			const targetContainer = config.availability === 'live' ? upcomingYearPicker : archivedYearPicker;
			clearContainer(targetContainer);
			targetContainer.appendChild(card);
			cardState.set(config.code, {
				config,
				card,
				units: {
					days: card.querySelector('[data-unit="days"]'),
					hours: card.querySelector('[data-unit="hours"]'),
					minutes: card.querySelector('[data-unit="minutes"]'),
					seconds: card.querySelector('[data-unit="seconds"]')
				},
				targetDate: null
			});
		}

		function pickFirstExam(entries) {
			return entries.reduce((best, entry) => {
				const currentDate = new Date(`${entry.date}T00:00:00`);
				if (!best || currentDate < best.date) {
					return {
						name: entry.name,
						date: currentDate,
						formatted: dateFormatter.format(currentDate)
					};
				}
				return best;
			}, null);
		}

		function formatCountdown(msRemaining) {
			const safeMs = Math.max(0, msRemaining);
			const totalSeconds = Math.floor(safeMs / 1000);
			const days = Math.floor(totalSeconds / 86400);
			const hours = Math.floor((totalSeconds % 86400) / 3600);
			const minutes = Math.floor((totalSeconds % 3600) / 60);
			const seconds = totalSeconds % 60;

			return {
				days,
				hours,
				minutes,
				seconds
			};
		}

		function updateTimers() {
			const now = new Date();

			for (const state of cardState.values()) {
				if (!state.targetDate) {
					continue;
				}

				const remaining = state.targetDate.getTime() - now.getTime();
				const countdown = formatCountdown(remaining);

				state.units.days.textContent = countdown.days.toString();
				state.units.hours.textContent = countdown.hours.toString().padStart(2, '0');
				state.units.minutes.textContent = countdown.minutes.toString().padStart(2, '0');
				state.units.seconds.textContent = countdown.seconds.toString().padStart(2, '0');

				if (remaining <= 0) {
					state.card.dataset.state = 'past';
					const badge = state.card.querySelector('.year-badge');
					badge.textContent = 'Archived';
					badge.classList.remove('live');
					badge.classList.add('past');
					if (state.card.parentElement === upcomingYearPicker) {
						archivedYearPicker.appendChild(state.card);
					}
				}
			}
		}

		async function hydrateCards() {
			await Promise.all(yearConfigs.filter((config) => config.availability === 'live').map(async (config) => {
				const state = cardState.get(config.code);

				try {
					const response = await fetch(`/countdown/${config.code}/dates.json`, { cache: 'no-store' });
					if (!response.ok) {
						throw new Error(`Unable to load dates for ${config.code}`);
					}

					const entries = await response.json();
					const firstExam = pickFirstExam(entries);

					if (!firstExam) {
						throw new Error(`No exam entries found for ${config.code}`);
					}

					state.targetDate = firstExam.date;
					state.card.title = `${firstExam.name} - ${firstExam.formatted}`;
				} catch (error) {
					state.units.days.textContent = '—';
					state.units.hours.textContent = '—';
					state.units.minutes.textContent = '—';
					state.units.seconds.textContent = '—';
				}
			}));

			updateTimers();
			window.setInterval(updateTimers, 1000);
		}

		yearConfigs.forEach(buildCard);
		hydrateCards();
	</script>
</body>

</html>
